<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Enviado - Decar Veículos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff7b00;
            --primary-light: #ff9a3c;
            --primary-dark: #e06d00;
            --secondary: #333333;
            --light-gray: #f5f5f5;
            --medium-gray: #e0e0e0;
            --dark-gray: #666666;
            --white: #ffffff;
            --border-radius: 8px;
            --box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }
        
        body {
            background-color: var(--light-gray);
            padding: 30px 20px;
            color: var(--secondary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
        }
        
        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            text-align: center;
            padding: 40px;
        }
        
        .header {
            background-color: var(--primary);
            padding: 25px 40px;
            margin: -40px -40px 30px -40px;
        }
        
        .header-content {
            color: var(--white);
            text-align: center;
        }
        
        .header-content h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            border: none;
            padding: 0;
        }
        
        .success-icon {
            font-size: 80px;
            color: var(--primary);
            margin: 20px 0;
        }
        
        h2 {
            font-size: 28px;
            color: var(--secondary);
            margin-bottom: 20px;
        }
        
        p {
            font-size: 16px;
            color: var(--dark-gray);
            margin-bottom: 30px;
        }
        
        .back-button {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 14px 30px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            display: inline-block;
        }
        
        .back-button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Decar Veículos</h1>
            </div>
        </div>
        
        <div class="success-icon">✓</div>
        <h2>Cadastro Enviado</h2>
        <p>Seu formulário foi enviado com sucesso! Entraremos em contato em breve.</p>
        <a href="index2.html" class="back-button">Voltar para o início</a>
    </div>
    
    <footer>
        <p>© 2023 Decar Veículos - Todos os direitos reservados</p>
    </footer>
</body>
</html>
