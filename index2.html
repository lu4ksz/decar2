<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Financiamento - Decar Veículos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff7b00;
            --primary-light: #ff9a3c;
            --primary-dark: #e06d00;
            --secondary: #333333;
            --light-gray: #f5f5f5;
            --medium-gray: #e0e0e0;
            --dark-gray: #666666;
            --white: #ffffff;
            --border-radius: 8px;
            --box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }
        
        body {
            background-color: var(--light-gray);
            padding: 30px 20px;
            color: var(--secondary);
            line-height: 1.6;
        }
        
        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }
        
        .header {
            background-color: var(--primary);
            padding: 25px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-content {
            color: var(--white);
            text-align: center;
        }
        
        .header-content h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            border: none;
            padding: 0;
        }
        
        .header-content p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .form-container {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 35px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
        }
        
        .section-icon {
            background-color: var(--primary);
            color: var(--white);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
        }
        
        h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--secondary);
            margin: 0;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }
        
        .form-group {
            padding: 0 10px;
            margin-bottom: 20px;
            flex: 1 1 100%;
        }
        
        .form-group.half {
            flex: 1 1 calc(50% - 20px);
        }
        
        .form-group.third {
            flex: 1 1 calc(33.333% - 20px);
        }
        
        @media (max-width: 768px) {
            .form-group.half, .form-group.third {
                flex: 1 1 100%;
            }
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--medium-gray);
            border-radius: var(--border-radius);
            font-size: 15px;
            transition: var(--transition);
        }
        
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 123, 0, 0.2);
        }
        
        .radio-group {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            margin-right: 20px;
            cursor: pointer;
        }
        
        .radio-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        
        .radio-checkmark {
            height: 20px;
            width: 20px;
            background-color: var(--white);
            border: 2px solid var(--medium-gray);
            border-radius: 50%;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        
        .radio-option:hover .radio-checkmark {
            border-color: var(--primary-light);
        }
        
        .radio-option input:checked ~ .radio-checkmark {
            background-color: var(--white);
            border-color: var(--primary);
        }
        
        .radio-checkmark:after {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            display: none;
        }
        
        .radio-option input:checked ~ .radio-checkmark:after {
            display: block;
        }
        
        .file-upload {
            margin-top: 10px;
        }
        
        .file-upload-label {
            display: inline-block;
            padding: 12px 20px;
            background-color: var(--light-gray);
            border: 1px dashed var(--dark-gray);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            width: 100%;
        }
        
        .file-upload-label:hover {
            background-color: var(--medium-gray);
        }
        
        .file-upload-label span {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: var(--dark-gray);
        }
        
        .file-upload input[type="file"] {
            display: none;
        }
        
        .note {
            margin-top: 8px;
            font-size: 12px;
            color: var(--dark-gray);
        }
        
        .submit-container {
            text-align: center;
            margin-top: 40px;
        }
        
        button {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 14px 30px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        .required-field::after {
            content: "*";
            color: #e74c3c;
            margin-left: 3px;
        }
        
        .progress-container {
            padding: 0 40px;
            margin-bottom: 30px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: var(--medium-gray);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 8px;
            color: var(--dark-gray);
        }
        
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            
            .header-content h1 {
                text-align: center;
            }
            
            .form-container {
                padding: 20px;
            }
            
            .progress-container {
                padding: 0 20px;
            }
        }
        
        .admin-link {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Ficha Cadastral para Financiamento</h1>
                <p>Preencha os dados abaixo para iniciar seu processo de financiamento</p>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span>Início</span>
                <span id="progressText">0% Completo</span>
                <span>Finalizado</span>
            </div>
        </div>
        
        <div class="form-container">
            <form id="financiamentoForm">
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">👤</div>
                        <h2>Dados Pessoais</h2>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="telefone" class="required-field">Telefone (importante que seja da mesma pessoa da ficha):</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="nome" class="required-field">Nome Completo:</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                        </div>
                        
                        <div class="form-group half">
                            <label for="dataNascimento" class="required-field">Data de Nascimento:</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="cpf" class="required-field">CPF:</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                        </div>
                        
                        <div class="form-group half">
                            <label for="rg" class="required-field">RG:</label>
                            <input type="text" id="rg" name="rg" placeholder="00.000.000-0" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nomeMae" class="required-field">Nome da Mãe:</label>
                            <input type="text" id="nomeMae" name="nomeMae" placeholder="Nome completo da sua mãe" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required-field">Tem CNH?</label>
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" name="temCNH" value="sim" id="cnhSim">
                                    <span class="radio-checkmark"></span>
                                    Sim
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="temCNH" value="nao" id="cnhNao">
                                    <span class="radio-checkmark"></span>
                                    Não
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row" id="cnhUploadGroup" style="display:none;">
                        <div class="form-group">
                            <label for="cnhUpload">Foto da CNH (aberta e legível):</label>
                            <div class="file-upload">
                                <label for="cnhUpload" class="file-upload-label">
                                    Clique para selecionar o arquivo
                                    <span>ou arraste e solte aqui</span>
                                </label>
                                <input type="file" id="cnhUpload" name="cnhUpload" accept="image/*">
                            </div>
                            <p class="note">Por favor, envie uma foto clara e legível da sua CNH aberta.</p>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email" class="required-field">E-mail:</label>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="endereco" class="required-field">Endereço residencial completo com CEP:</label>
                            <textarea id="endereco" name="endereco" rows="3" placeholder="Rua, número, complemento, bairro, cidade, estado e CEP" required></textarea>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-header">
                        <div class="section-icon">💼</div>
                        <h2>Dados Profissionais</h2>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="profissao" class="required-field">Qual é a sua profissão?</label>
                            <input type="text" id="profissao" name="profissao" placeholder="Digite sua profissão" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="empresa">Trabalhando em qual empresa?</label>
                            <input type="text" id="empresa" name="empresa" placeholder="Nome da empresa">
                        </div>
                        
                        <div class="form-group half">
                            <label for="autonomo">É autônomo em qual ramo?</label>
                            <input type="text" id="autonomo" name="autonomo" placeholder="Ramo de atividade autônoma">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="renda" class="required-field">Valor da sua renda total?</label>
                            <input type="number" id="renda" name="renda" min="0" step="0.01" placeholder="R$ 0,00" required>
                        </div>
                    </div>
                </div>
                
                <div class="submit-container">
                    <button type="submit" id="submitBtn">Enviar Cadastro</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Hidden admin link -->
    <a href="login.html" class="admin-link" id="adminLink">Admin</a>
    
    <footer>
        <p>© 2023 Decar Veículos - Todos os direitos reservados</p>
    </footer>
    
    <!-- Add config.js script reference -->
    <script src="config.js"></script>
    
    <!-- Add sync.js script reference -->
    <script src="sync.js"></script>
    
    <script>
        // Check for form configuration in localStorage
        const storedConfig = localStorage.getItem('formConfig');
        if (storedConfig) {
            try {
                const formConfig = JSON.parse(storedConfig);
                
                // Apply title
                document.querySelector('.header-content h1').textContent = formConfig.title;
                
                // Apply button text
                if (formConfig.submitButtonText) {
                    document.getElementById('submitBtn').textContent = formConfig.submitButtonText;
                }
            } catch (e) {
                console.error('Error parsing stored configuration:', e);
            }
        }
        
        // Show or hide CNH upload field based on radio selection
        document.getElementById('cnhSim').addEventListener('change', function() {
            document.getElementById('cnhUploadGroup').style.display = 'block';
            updateProgress();
        });
        
        document.getElementById('cnhNao').addEventListener('change', function() {
            document.getElementById('cnhUploadGroup').style.display = 'none';
            updateProgress();
        });
        
        // Progress bar functionality
        const form = document.getElementById('financiamentoForm');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const requiredFields = form.querySelectorAll('[required]');
        const radioGroups = form.querySelectorAll('.radio-group');
        
        function updateProgress() {
            let filledCount = 0;
            
            // Check required text inputs
            requiredFields.forEach(field => {
                if (field.value.trim() !== '') {
                    filledCount++;
                }
            });
            
            // Check radio buttons
            radioGroups.forEach(group => {
                const radios = group.querySelectorAll('input[type="radio"]');
                let isChecked = false;
                
                radios.forEach(radio => {
                    if (radio.checked) {
                        isChecked = true;
                    }
                });
                
                if (isChecked) {
                    filledCount++;
                }
            });
            
            const totalFields = requiredFields.length + radioGroups.length;
            const progressPercentage = Math.round((filledCount / totalFields) * 100);
            
            progressBar.style.width = progressPercentage + '%';
            progressText.textContent = progressPercentage + '% Completo';
        }
        
        // Add event listeners to all form fields
        requiredFields.forEach(field => {
            field.addEventListener('input', updateProgress);
            field.addEventListener('change', updateProgress);
        });
        
        radioGroups.forEach(group => {
            const radios = group.querySelectorAll('input[type="radio"]');
            radios.forEach(radio => {
                radio.addEventListener('change', updateProgress);
            });
        });
        
        // File upload preview
        const fileInput = document.getElementById('cnhUpload');
        const fileLabel = document.querySelector('.file-upload-label');
        
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileLabel.textContent = this.files[0].name;
            } else {
                fileLabel.innerHTML = 'Clique para selecionar o arquivo <span>ou arraste e solte aqui</span>';
            }
        });
        
        // Form submission handling
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            console.log("Formulário enviado - iniciando processamento");
            
            // Validate form
            let isValid = true;
            requiredFields.forEach(field => {
                if (field.value.trim() === '') {
                    field.style.borderColor = '#e74c3c';
                    isValid = false;
                    console.log("Campo obrigatório não preenchido:", field.id);
                } else {
                    field.style.borderColor = '';
                }
            });
            
            // Check if CNH radio is selected
            const cnhRadios = document.querySelectorAll('input[name="temCNH"]');
            let cnhSelected = false;
            cnhRadios.forEach(radio => {
                if (radio.checked) {
                    cnhSelected = true;
                }
            });
            
            if (!cnhSelected) {
                document.querySelector('.radio-group').style.borderColor = '#e74c3c';
                isValid = false;
                console.log("Opção de CNH não selecionada");
            } else {
                document.querySelector('.radio-group').style.borderColor = '';
            }
            
            if (isValid) {
                console.log("Formulário válido - preparando para salvar");
                
                // Show loading indicator in submit button
                const submitBtn = document.getElementById('submitBtn');
                const originalBtnText = submitBtn.textContent;
                submitBtn.textContent = 'Enviando...';
                submitBtn.disabled = true;
                
                try {
                    // Get success message from localStorage or use default
                    let successMessage = 'Cadastro enviado com sucesso! Entraremos em contato em breve.';
                    if (storedConfig) {
                        try {
                            const formConfig = JSON.parse(storedConfig);
                            if (formConfig.successMessage) {
                                successMessage = formConfig.successMessage;
                            }
                        } catch (e) {}
                    }
                    
                    // Create form submission object
                    const formData = new FormData(form);
                    const submission = {
                        id: Date.now(),
                        dataSubmissao: new Date().toISOString()
                    };
                    
                    // Convert FormData to object
                    for (let [key, value] of formData.entries()) {
                        if (key !== 'cnhUpload') { // Skip file upload
                            submission[key] = value;
                        }
                    }
                    
                    console.log("Objeto de submissão criado:", submission.id);
                    
                    // Create lead entry with default status
                    const leadEntry = {
                        ...submission,
                        status: 'novo',
                        ultimaAtualizacao: new Date().toISOString(),
                        notas: []
                    };
                    
                    console.log("Tentando salvar no arquivo central...");
                    
                    // Try to save to central file first
                    let savedToCentralFile = false;
                    
                    try {
                        // Save to central file
                        savedToCentralFile = await DATA_SYNC.saveSubmission(submission, leadEntry);
                        console.log('Resultado do salvamento no arquivo central:', savedToCentralFile ? 'Sucesso' : 'Falha');
                    } catch (error) {
                        console.warn('Falha ao salvar no arquivo central:', error);
                        // Continue to save locally as fallback
                    }
                    
                    // If central file save failed, save to localStorage as fallback
                    if (!savedToCentralFile) {
                        console.log("Salvamento no arquivo central falhou - usando localStorage como fallback");
                        
                        // Save submission to localStorage
                        const submissions = JSON.parse(localStorage.getItem('formSubmissions') || '[]');
                        submissions.push(submission);
                        localStorage.setItem('formSubmissions', JSON.stringify(submissions));
                        
                        // Also save as a lead with default status
                        const leads = JSON.parse(localStorage.getItem('formLeads') || '[]');
                        leads.push(leadEntry);
                        localStorage.setItem('formLeads', JSON.stringify(leads));
                        
                        console.log('Dados salvos no localStorage como alternativa');
                    }
                    
                    // Debug to console to verify
                    console.log('Salvamento concluído. Redirecionando para página de sucesso...');
                    
                    // Redirect to success page
                    window.location.href = 'success.html';
                } catch (error) {
                    console.error('Erro ao salvar dados do formulário:', error);
                    alert('Ocorreu um erro ao enviar o formulário. Por favor, tente novamente.');
                    
                    // Reset button
                    submitBtn.textContent = originalBtnText;
                    submitBtn.disabled = false;
                }
            } else {
                console.log("Formulário inválido - exibindo mensagem de erro");
                alert('Por favor, preencha todos os campos obrigatórios.');
            }
        });
        
        // Initialize progress
        updateProgress();
        
        // Secret admin access via keyboard shortcut
        let adminCode = '';
        document.addEventListener('keydown', function(event) {
            // Admin access with key combination Ctrl+Alt+A
            if (event.ctrlKey && event.altKey && event.key === 'a') {
                window.location.href = 'login.html';
            }
            
            // Alternative: track a specific sequence of keys
            adminCode += event.key;
            if (adminCode.includes('adminaccess')) {
                window.location.href = 'login.html';
                adminCode = '';
            }
            
            // Reset code after some time
            setTimeout(() => { adminCode = ''; }, 2000);
        });
    </script>
</body>
</html>
